# Same organization (42c3e46f…) and groups as the tenant repo's sample policy
# for alice, so alice can use the virtual model; bob belongs to organization
# 53d4f57e… and would need his own subscription. 1000 tokens per minute keeps
# the acceptance 429 probe cheap.
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: vcr-smollm2-sub
  namespace: models-as-a-service
  annotations:
    openshift.io/display-name: vcr-smollm2-sub
spec:
  organization:
    id: 42c3e46f-2477-44d7-a85b-d3b43f6b31fa
  modelRefs:
    - name: vcr-smollm2
      namespace: models-as-a-service
      tokenRateLimits:
        - limit: 1000
          window: 1m
  owner:
    groups:
      - name: 42c3e46f-2477-44d7-a85b-d3b43f6b31fa/ai-grid-users
    users: []
  priority: 0
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: vcr-smollm2-sub-policy
  namespace: models-as-a-service
  annotations:
    openshift.io/display-name: vcr-smollm2-sub
  labels:
    ai-grid/subscription: vcr-smollm2-sub
spec:
  modelRefs:
    - name: vcr-smollm2
      namespace: models-as-a-service
  subjects:
    groups:
      - name: 42c3e46f-2477-44d7-a85b-d3b43f6b31fa/ai-grid-admins
      - name: 42c3e46f-2477-44d7-a85b-d3b43f6b31fa/ai-grid-users
    users: []
